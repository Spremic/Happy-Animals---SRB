<!DOCTYPE html>
<html lang="sr" id="html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Korpa – Happy Animals</title>

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://code.jquery.com" />

    <!-- Critical CSS -->
    <link rel="preload" href="/css/clone.css" as="style" />
    <link rel="preload" href="/css/shopping-cart.css" as="style" />
    <link rel="preload" href="/css/loader.css" as="style" />
    <link rel="stylesheet" href="/css/clone.css" />
    <link rel="stylesheet" href="/css/shopping-cart.css" />
    <link rel="stylesheet" href="/css/loader.css" />

    <!-- External CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </head>
  <body id="body">
    <!-- Page Loader -->
    <div id="page-loader">
      <div class="loader-content">
        <div class="loader-logo">
          <svg
            class="loader-paw"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            fill="currentColor"
          >
            <path
              d="M226.5 92.9c14.3 42.9-.3 86.2-32.6 96.8s-70.1-15.6-84.4-58.5s.3-86.2 32.6-96.8s70.1 15.6 84.4 58.5zM100.4 198.6c18.9 32.4 14.3 70.1-10.2 84.1s-59.7-.9-78.5-33.3S-2.7 179.3 21.8 165.3s59.7 .9 78.5 33.3zM69.2 401.2C121.6 259.9 214.7 224 256 224s134.4 35.9 186.8 177.2c3.6 9.7 5.2 20.1 5.2 30.5v1.6c0 25.8-20.9 46.7-46.7 46.7c-11.5 0-22.9-1.4-34-4.2l-88-22c-15.3-3.8-31.3-3.8-46.6 0l-88 22c-11.1 2.8-22.5 4.2-34 4.2C84.9 480 64 459.1 64 433.3v-1.6c0-10.4 1.6-20.8 5.2-30.5zM421.8 282.7c-24.5-14-29.1-51.7-10.2-84.1s54-47.3 78.5-33.3s29.1 51.7 10.2 84.1s-54 47.3-78.5 33.3zM310.1 189.7c-32.3-10.6-46.9-53.9-32.6-96.8s52.1-69.1 84.4-58.5s46.9 53.9 32.6 96.8s-52.1 69.1-84.4 58.5z"
            />
          </svg>
        </div>
        <div class="loader-text">Happy Animals</div>
        <div class="loader-progress">
          <div class="loader-progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- CONTET -->

    <section id="shopping-cart-section">
      <div class="container">
        <div class="cart-header">
          <h2>KORPA <span>ZA KUPOVINU</span></h2>
        </div>

        <div class="cart-content">
          <div class="shipping-address">
            <h3>Adresa za dostavu</h3>
            <div class="address-form">
              <form class="shipping-form">
                <div class="form-row">
                  <div class="form-group" data-placeholder="Ime *">
                    <input type="text" id="firstName" name="firstName" required>
                  </div>
                  <div class="form-group" data-placeholder="Prezime *">
                    <input type="text" id="lastName" name="lastName" required>
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-group" data-placeholder="Broj telefona *">
                    <input type="tel" id="phone" name="phone" required>
                  </div>
                  <div class="form-group" data-placeholder="E-pošta *">
                    <input type="email" id="email" name="email" required>
                  </div>
                </div>

                <div class="form-group" data-placeholder="Poštanski broj *">
                  <input type="text" id="zipCode" name="zipCode" required>
                </div>

                <div class="form-row">
                  <div class="form-group" data-placeholder="Grad *">
                    <input type="text" id="city" name="city" required>
                  </div>
                  <div class="form-group" data-placeholder="Država *">
                    <input type="text" id="state" name="state" maxlength="2" required>
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-group" data-placeholder="Ulica i broj *">
                    <input type="text" id="streetAddress" name="streetAddress" required>
                  </div>
                  <div class="form-group" data-placeholder="Stan, broj, sprat, itd.">
                    <input type="text" id="apartment" name="apartment">
                  </div>
                </div>

                <div class="form-group" data-placeholder="Dodatne napomene">
                  <textarea id="notes" name="notes" rows="8"></textarea>
                </div>

                <div class="payment-section">
                  <h4>Način plaćanja</h4>

                  <div class="payment-list">
                    <div class="payment-row">
                      <input type="radio" id="cod" name="payment" value="cod" checked>
                      <label for="cod" class="payment-label active">
                        <div class="payment-header">
                          <div class="custom-radio"></div>
                          <span class="service-name">Pouzećem</span>
                          <div class="service-logos">
                            <span class="material-symbols-outlined" style="font-size: 32px; color: #009900;">payments</span>
                          </div>
                        </div>

                        <!-- Cash on Delivery Form -->
                        <div class="payment-form" id="cod-form">
                          <div class="cod-notice">
                            <p>Plaćanje se vrši prilikom preuzimanja paketa. Dostavljač će vam uručiti paket i primiti gotovinu.</p>
                          </div>
                          <button type="button" class="payment-btn">Završi porudžbinu</button>
                        </div>
                      </label>
                    </div>

                  </div>
                </div>
              </form>
            </div>
          </div>

          <div class="order-summary">
            <h3 class="order-title">
              <span class="order-text">
                Vaša porudžbina<span class="product-count">0</span>
              </span>
              <span class="order-total">Ukupno: 0.00 RSD</span>
            </h3>

            <div class="coupon-box" style="margin: 12px 0 18px; display: flex; gap: 8px; flex-wrap: wrap;">
              <input
                type="text"
                id="couponCode"
                name="couponCode"
                placeholder="Kupon kod (npr. HA10)"
                aria-label="Kupon kod"
                style="flex: 1; min-width: 150px; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #141414; color: #fff; font-size: 0.92rem;"
              />
              <button
                type="button"
                id="applyCouponBtn"
                style="padding: 10px 16px; border-radius: 8px; border: none; background: #009900; color: #fff; font-weight: 600; cursor: pointer;"
              >Primeni</button>
              <div id="couponFeedback" style="width: 100%; font-size: 0.85rem; color: #a0a0a0;"></div>
            </div>

            <div class="order-details">
              <!-- Proizvodi će biti dinamički učitani iz shopping-cart.js -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="/js/clone.js" defer></script>
    <script src="/js/shopping-cart.js" defer></script>
    <script src="/js/loader.js" defer></script>
    <script>
      // Handle payment method selection (Pouzecem / COD only)
      document.querySelectorAll('input[name="payment"]').forEach(radio => {
        radio.addEventListener('change', function() {
          document.querySelectorAll('.payment-label').forEach(label => label.classList.remove('active'));
          document.querySelectorAll('.payment-form').forEach(form => form.style.display = 'none');
          if (this.checked) {
            this.nextElementSibling.classList.add('active');
            const form = document.getElementById('cod-form');
            if (form) form.style.display = 'block';
          }
        });
      });

      // Initialize payment form visibility on page load
      document.addEventListener('DOMContentLoaded', function() {
        const codRadio = document.getElementById('cod');
        if (codRadio) {
          codRadio.checked = true;
          codRadio.dispatchEvent(new Event('change'));
        }
      });

      // Handle floating labels for shipping form
      document.querySelectorAll('.shipping-form input, .shipping-form textarea').forEach(input => {
        const formGroup = input.closest('.form-group');
        if (!formGroup) return; // Skip if not in a form-group

        const placeholder = formGroup.getAttribute('data-placeholder');
        if (!placeholder) return; // Skip if no data-placeholder

        // Create floating label element for all inputs
        let floatingLabel = formGroup.querySelector('.floating-label');
        if (!floatingLabel) {
          floatingLabel = document.createElement('span');
          floatingLabel.className = 'floating-label';

          if (placeholder && placeholder.includes('*')) {
            const cleanText = placeholder.replace('*', '').trim();
            floatingLabel.innerHTML = cleanText + '<span class="green-asterisk">*</span>';
          } else {
            floatingLabel.textContent = placeholder;
          }

          formGroup.appendChild(floatingLabel);
        }

        // Check initial state - only show if input has value
        if (input.value) {
          formGroup.classList.add('floating');
        } else {
          formGroup.classList.remove('floating');
        }

        input.addEventListener('focus', function() {
          formGroup.classList.add('floating');
        });

        input.addEventListener('blur', function() {
          if (!this.value) {
            formGroup.classList.remove('floating');
          }
        });

        input.addEventListener('input', function() {
          if (this.value) {
            formGroup.classList.add('floating');
          } else {
            formGroup.classList.remove('floating');
          }
        });
      });

      // Make asterisks green in floating labels
      function updateFloatingLabels() {
        document.querySelectorAll('.form-group.floating').forEach(group => {
          const beforeElement = window.getComputedStyle(group, '::before');
          const content = beforeElement.content;
          if (content && content.includes('*')) {
            // Replace * with green asterisk
            const newContent = content.replace(/\*/g, '<span style="color: #009900">*</span>');
            // We need to update the content property
            group.style.setProperty('--floating-content', newContent);
          }
        });
      }

      // Update floating labels on DOM changes
      const observer = new MutationObserver(updateFloatingLabels);
      observer.observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class'] });

      // Order items functionality (now handled by shopping-cart.js)
      document.addEventListener('DOMContentLoaded', function() {

        // Make order summary sticky - stable at bottom when scrolling
        function makeOrderSummarySticky() {
          // Disable sticky behavior on screens smaller than 1025px
          if (window.innerWidth <= 1024) return;

          const orderSummary = document.querySelector('.order-summary');
          const cartContent = document.querySelector('.cart-content');
          const header = document.querySelector('header');

          if (!orderSummary || !cartContent || !orderSummary.dataset.originalTop) return;

          const scrollY = window.scrollY;
          const originalTop = parseInt(orderSummary.dataset.originalTop);

          // Calculate header height
          const headerHeight = header ? header.offsetHeight : 95; // Fallback to 95px if header not found
          const stickyTop = headerHeight + 20; // 20px padding below header

          // Get the bottom position of cart-content
          const cartContentRect = cartContent.getBoundingClientRect();
          const cartContentBottom = cartContentRect.bottom + window.scrollY;

          // Make sticky when header touches order summary, but stop before cart-content ends
          if (scrollY > (originalTop - stickyTop) && scrollY < (cartContentBottom - stickyTop - orderSummary.offsetHeight)) {
            // If it was stopped, clear that state and make it sticky again
            if (orderSummary.dataset.isStopped) {
              orderSummary.dataset.isStopped = '';
            }
            orderSummary.style.position = 'fixed';
            orderSummary.style.top = stickyTop + 'px';
            orderSummary.style.bottom = 'auto';
            orderSummary.style.left = orderSummary.dataset.originalLeft;
            orderSummary.style.width = orderSummary.dataset.originalWidth;
            orderSummary.style.flex = 'none';
            orderSummary.dataset.isSticky = 'true';
          } else if (scrollY >= (cartContentBottom - stickyTop - orderSummary.offsetHeight) && !orderSummary.dataset.isStopped) {
            // Stop at cart-content end position - align bottom with cart-content bottom
            const cartContentHeight = cartContent.offsetHeight;
            const relativeTop = cartContentHeight - orderSummary.offsetHeight;

            orderSummary.style.position = 'relative';
            orderSummary.style.top = relativeTop + 'px';
            orderSummary.style.bottom = 'auto';
            orderSummary.style.left = '';
            orderSummary.style.width = orderSummary.dataset.originalWidth; // Keep original width
            orderSummary.style.flex = 'none';
            orderSummary.dataset.isSticky = '';
            orderSummary.dataset.isStopped = 'true';
          } else if (scrollY <= originalTop + 50) {
            // Only return to normal position when scrolling way back up
            orderSummary.style.position = '';
            orderSummary.style.top = '';
            orderSummary.style.bottom = '';
            orderSummary.style.left = '';
            orderSummary.style.width = '';
            orderSummary.style.flex = '';
            orderSummary.dataset.isSticky = '';
            orderSummary.dataset.isStopped = '';
          }
          // If stopped, keep the current position
        }

        // Initialize sticky positioning data on load
        function initializeStickyData() {
          const orderSummary = document.querySelector('.order-summary');
          if (orderSummary && !orderSummary.dataset.initialized) {
            const rect = orderSummary.getBoundingClientRect();
            orderSummary.dataset.originalTop = (rect.top + window.scrollY) + 'px';
            orderSummary.dataset.originalLeft = orderSummary.offsetLeft + 'px';
            orderSummary.dataset.originalWidth = orderSummary.offsetWidth + 'px';
            orderSummary.dataset.initialized = 'true';
          }
        }

        // Initialize on load
        initializeStickyData();

        // Add scroll event listener
        window.addEventListener('scroll', makeOrderSummarySticky);
        window.addEventListener('resize', function() {
          initializeStickyData();
          makeOrderSummarySticky();
        });
      });
    </script>
  </body>
</html>
